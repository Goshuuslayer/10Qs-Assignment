<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delivery Charges</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#2B2730; font-family:'Courier New', monospace; padding:20px;}
  .box{ background:#FBF7EE; width:min(380px,92vw); padding:24px; border-radius:8px;
    box-shadow:0 15px 30px rgba(0,0,0,.35); color:#221D18; font-size:15px; line-height:1.7;}
  .box hr{ border:none; border-top:1px dashed #999; margin:10px 0;}
  .box b{ display:inline-block; width:160px;}
</style>
</head>
<body>
<script>
  // Ask order amount
  let amount = parseFloat(prompt("Enter order amount:"));

  let delivery;
  if (amount >= 100) {
    delivery = 0;
  } else if (amount >= 50) {
    delivery = 5;
  } else {
    delivery = 10;
  }

  let finalAmount = amount + delivery;

  document.write(`
    <div class="box">
      <center><b>===== DELIVERY CHARGES =====</b></center>
      <hr>
      <b>Order Amount:</b> $${amount}<br>
      <b>Delivery Charges:</b> ${delivery === 0 ? "Free" : "$" + delivery}<br>
      <b>Final Amount:</b> $${finalAmount}<br>
      <hr>
    </div>
  `);
</script>
</body>
</html>
