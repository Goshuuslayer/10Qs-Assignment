<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class Attendance</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#2B2730; font-family:'Courier New', monospace; padding:20px;}
  .box{ background:#FBF7EE; width:min(380px,92vw); padding:24px; border-radius:8px;
    box-shadow:0 15px 30px rgba(0,0,0,.35); color:#221D18; font-size:15px; line-height:1.7;}
  .box hr{ border:none; border-top:1px dashed #999; margin:10px 0;}
</style>
</head>
<body>
<script>
  // Array of 10 student names
  let students = ["Ahmed", "Muhammad", "Sara", "Zainab", "Ali",
                   "Hina", "Bilal", "Ayesha", "Usman", "Fatima"];

  let output = "<center><b>===== CLASS ATTENDANCE =====</b></center><hr>";

  // Loop through and display with serial number
  for (let i = 0; i < students.length; i++) {
    output += (i + 1) + ". " + students[i] + "<br>";
  }

  output += "<hr><b>Total Students:</b> " + students.length;

  document.write(`<div class="box">${output}</div>`);
</script>
</body>
</html>
