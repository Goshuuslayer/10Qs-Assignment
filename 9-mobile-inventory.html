<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile Inventory</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#2B2730; font-family:'Courier New', monospace; padding:20px;}
  .box{ background:#FBF7EE; width:min(380px,92vw); padding:24px; border-radius:8px;
    box-shadow:0 15px 30px rgba(0,0,0,.35); color:#221D18; font-size:15px; line-height:1.7;}
  .box hr{ border:none; border-top:1px dashed #999; margin:10px 0;}
</style>
</head>
<body>
<script>
  // Array of 5 mobile phones
  let mobiles = ["iPhone 15", "Samsung S24", "Google Pixel 9", "OnePlus 12", "Xiaomi 14"];

  // 1. Add a new mobile
  mobiles.push("Realme 12");

  // 2. Remove one mobile (removing the first one)
  mobiles.splice(0, 1);

  // 3. Display all mobiles using a for loop
  let output = "<center><b>===== MOBILE INVENTORY =====</b></center><hr>";
  for (let i = 0; i < mobiles.length; i++) {
    output += (i + 1) + ". " + mobiles[i] + "<br>";
  }

  // 4. Display total using .length
  output += "<hr><b>Total Mobiles:</b> " + mobiles.length;

  document.write(`<div class="box">${output}</div>`);
</script>
</body>
</html>
